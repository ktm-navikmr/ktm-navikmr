<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KTM Adventure Rally · Kerala, India 2027</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#FF6600; --orange-deep:#E05200; --orange-wash:#FFF1E6;
  --loop1:#FF6600; --loop2:#1E88E5; --road:#FFD54A;
  --ink:#22282B; --muted:#66706B; --line:rgba(34,40,43,.11);
  --panel:rgba(255,255,255,.95); --solid:#FFFFFF; --wash:#F3F6F1;
  --tea:#3F7D4A; --tea-wash:#E8F2E6; --sky:#2F86B5; --sky-wash:#E5F1F8;
  --head:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0d1410;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;overflow:hidden}
#map{position:fixed;inset:0;background:#0d1410}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
a{color:var(--orange-deep)}


/* ---------- Home ---------- */
#home{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity 1.1s ease}
#home .slide{position:absolute;inset:-4%;background:center/cover no-repeat;opacity:0;transition:opacity 1.1s ease;transform:scale(1.04)}
#home .slide{filter:saturate(1.6) contrast(1.12) brightness(1.06) hue-rotate(8deg)}
#home .slide.on{opacity:.9;animation:kbs 4s ease-out forwards}
#home .grade{position:absolute;inset:0;background:linear-gradient(160deg,rgba(40,150,70,.28),rgba(10,60,30,.18) 60%,rgba(255,140,40,.12));mix-blend-mode:soft-light;pointer-events:none}
@keyframes kbs{from{transform:scale(1.12) translate(1.5%,1%)}to{transform:scale(1.02) translate(0,0)}}
#home .sat{position:absolute;inset:0;background:rgba(10,20,12,.25)}
#homeRoute{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#homeRoute .rt{fill:none;stroke:#FF6600;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(255,102,0,.9))}
#homeRoute .rtbg{fill:none;stroke:rgba(255,255,255,.18);stroke-width:2;stroke-dasharray:4 8}
#homeRoute circle{fill:#fff;stroke:#FF6600;stroke-width:3}
#home .shade{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 0%,rgba(0,0,0,.18) 45%,rgba(6,12,8,.78) 100%),linear-gradient(to bottom,rgba(10,20,12,.25),rgba(10,20,12,.05) 40%,rgba(10,20,12,.45))}
#home .dust{position:absolute;left:0;right:0;bottom:-10%;height:45%;background:radial-gradient(ellipse at 50% 100%,rgba(180,110,50,.35),transparent 70%);animation:dust 9s ease-in-out infinite alternate}
#enter{position:relative;border:0;background:none;padding:0;width:min(46vh,440px);aspect-ratio:676/612;animation:floaty 5s ease-in-out infinite}
#enter img{width:100%;height:100%;display:block;filter:drop-shadow(0 18px 40px rgba(0,0,0,.6));transition:transform .35s ease,filter .35s ease}
#enter:hover img{transform:scale(1.04);filter:drop-shadow(0 22px 50px rgba(255,102,0,.55))}
#enter::after{content:"";position:absolute;inset:-14%;border-radius:50%;border:2px solid rgba(255,140,60,.55);animation:ring 2.8s ease-out infinite;pointer-events:none}
#home.leaving{opacity:0;pointer-events:none}
#home.leaving #enter{animation:zoomout .9s cubic-bezier(.6,0,.4,1) forwards}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-2%,-2%)}}
@keyframes kb2{from{transform:scale(1.1) translate(2%,0)}to{transform:scale(1) translate(-1%,1%)}}
@keyframes xfade{0%,40%{opacity:0}55%,85%{opacity:.5}100%{opacity:0}}
@keyframes dust{from{opacity:.5;transform:translateX(-3%)}to{opacity:1;transform:translateX(3%)}}
@keyframes floaty{50%{transform:translateY(-10px)}}
@keyframes ring{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.15);opacity:0}}
@keyframes zoomout{to{transform:scale(2.4);opacity:0}}
body.at-home #story,body.at-home #rail,body.at-home .leaflet-control-container{opacity:0;pointer-events:none}

/* ---------- Story panel ---------- */
#story{position:fixed;top:18px;left:18px;bottom:84px;width:440px;background:var(--panel);backdrop-filter:blur(10px);
  border-radius:16px;z-index:500;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.35);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
#story::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--orange);z-index:2}
#story .scroll{overflow-y:auto;padding:26px 28px 20px 32px;flex:1}
#story .foot{display:flex;gap:8px;padding:12px 28px 14px 32px;border-top:1px solid var(--line);background:var(--solid)}
body.at-home #story{transform:translateX(-110%)}
.enter-anim>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.enter-anim>*:nth-child(2){animation-delay:.05s}.enter-anim>*:nth-child(3){animation-delay:.1s}.enter-anim>*:nth-child(4){animation-delay:.15s}
.enter-anim>*:nth-child(5){animation-delay:.2s}.enter-anim>*:nth-child(6){animation-delay:.25s}.enter-anim>*:nth-child(n+7){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.kicker{font-family:var(--head);font-weight:600;color:var(--orange-deep);font-size:19px;margin:0 0 4px}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.02;color:var(--ink)}
h2{font-size:44px;font-weight:700}
h3{font-size:22px;font-weight:600;margin:22px 0 8px}
p{margin:10px 0}
.lede{font-size:18px}
.muted{color:var(--muted)}
.small{font-size:14px}
.hero{margin:-26px -28px 18px -32px;height:210px;position:relative;overflow:hidden;background:var(--tea-wash)}
.hero img{width:100%;height:100%;object-fit:cover;display:block;animation:kb 20s ease-in-out infinite alternate}
.hero .logo{position:absolute;right:14px;bottom:10px;width:120px;height:auto;animation:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.cover-title{font-size:70px;line-height:.9;font-weight:700;margin-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.stats div{background:var(--wash);border-radius:10px;padding:12px 14px}
.stats b{display:block;font-family:var(--head);font-size:34px;font-weight:700;line-height:1;color:var(--ink)}
.stats b .u{font-size:20px;font-weight:600;color:var(--muted);margin-left:3px}
.stats span.l{font-size:13.5px;color:var(--muted)}
.stats .hot{background:var(--orange-wash)}
.stats .hot b{color:var(--orange-deep)}
ul.clean{list-style:none;padding:0;margin:8px 0}
ul.clean li{padding:8px 0;border-bottom:1px solid var(--line)}
.row-btn{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;padding:9px 6px;text-align:left;border-radius:8px}
.row-btn:hover{background:var(--wash)}
.row-btn:hover .rb-name{color:var(--orange-deep)}
.rb-name{font-weight:600;flex:1}
.rb-meta{font-size:13px;color:var(--muted)}
.chillies{display:inline-flex;gap:1px;vertical-align:middle}
.chillies svg{width:16px;height:16px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--orange-wash);color:var(--orange-deep);margin-left:4px;vertical-align:middle}
.tag.tbc{background:#EEF0EC;color:var(--muted)}
.tag.tea{background:var(--tea-wash);color:var(--tea)}
.tag.l1{background:var(--loop1);color:#fff}.tag.l2{background:var(--loop2);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two h3{margin-top:6px}
.plan{list-style:none;margin:10px 0 0;padding:0;counter-reset:s}
.plan li{position:relative;padding:0 0 0 38px;margin:0}
.plan li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:8px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--head);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px}
.plan li.road::before{background:#C99A00}.plan li.ret::before{background:#00BCD4}.plan li.gap::before{background:#FF2E88}.plan li.l1::before{background:var(--loop1)}.plan li.l2::before{background:var(--loop2)}.plan li.pace::before{background:var(--tea)}
.plan li::after{content:"";position:absolute;left:12px;top:36px;bottom:-6px;width:2px;background:var(--line)}
.plan li:last-child::after{display:none}
.plan .row-btn{padding:8px 6px}
.ladder{display:flex;align-items:flex-end;gap:10px;height:160px;margin:24px 0 6px}
.ladder button{flex:1;border:0;background:linear-gradient(to top,var(--orange),#FFB27A);border-radius:6px 6px 0 0;position:relative;padding:0;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.ladder button:nth-child(2){animation-delay:.12s}.ladder button:nth-child(3){animation-delay:.24s}
@keyframes grow{from{transform:scaleY(0)}}
.ladder button span{position:absolute;bottom:calc(100% + 4px);left:0;right:0;text-align:center;font-family:var(--head);font-weight:600;font-size:19px;color:var(--ink)}
.ladder-labels{display:flex;gap:10px}.ladder-labels div{flex:1;font-size:13px;color:var(--muted);text-align:center}
.ladder-labels b{color:var(--ink);font-family:var(--head);font-size:17px}
.timeline{border-left:2px solid var(--orange);margin:10px 0 0 6px;padding-left:16px}
.timeline div{position:relative;padding:5px 0}
.timeline div::before{content:"";position:absolute;left:-23px;top:11px;width:12px;height:12px;border-radius:50%;background:var(--solid);border:2px solid var(--orange)}
.timeline b{font-family:var(--head);font-size:18px;margin-right:6px}
.profile svg{width:100%;height:84px;display:block}
.pbtn{border:1px solid var(--line);background:var(--solid);border-radius:9px;padding:8px 13px;font-size:14px;font-weight:600}
.pbtn:hover{border-color:var(--orange);color:var(--orange-deep)}
.pbtn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.pbtn.primary:hover{background:var(--orange-deep);color:#fff}
.pbtn:disabled{opacity:.4;cursor:default}
.playbar{margin:14px 0 4px;background:var(--orange-wash);border-radius:12px;padding:10px 12px}
.playbar .row{display:flex;align-items:center;gap:10px}
.playbar .track{flex:1;height:6px;background:rgba(224,82,0,.18);border-radius:3px;overflow:hidden}
.playbar .track i{display:block;height:100%;width:0;background:var(--orange)}
.playbar .phase{font-size:13px;font-weight:600;color:var(--orange-deep);margin-top:6px;min-height:18px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:4px}
.goa-src{font-size:12.5px;color:var(--muted);margin-top:14px}
.clips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-top:6px}
.clip{flex:0 0 132px;border:0;padding:0;background:none;text-align:left}
.clip .th{width:132px;height:76px;border-radius:8px;background:var(--sky-wash) center/cover no-repeat;position:relative;overflow:hidden}
.clip .th::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at center,rgba(0,0,0,.35) 0 16px,transparent 17px)}
.clip .th::before{content:"";position:absolute;left:50%;top:50%;margin:-7px 0 0 -4px;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;z-index:1}
.clip span{display:block;font-size:12.5px;font-weight:600;margin-top:4px}
.clip:hover span{color:var(--orange-deep)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);cursor:pointer}
.addclips{background:var(--sky-wash);border-radius:12px;padding:12px;margin-top:8px}
.addclips textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:13px;background:#fff;resize:vertical}

/* Editable */
body.edit .ed,body.edit .tx{outline:1.5px dashed var(--orange);outline-offset:2px;cursor:text;border-radius:3px}
body.edit .ed{background:rgba(255,102,0,.07)}
body.edit .ed:focus,body.edit .tx:focus{background:#fff;outline-style:solid}

/* Feedback */
.fb{margin-top:24px;background:var(--wash);border-radius:12px;padding:14px 14px 10px}
.fb h3{margin:0 0 8px;font-size:21px}
.fb .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.fb .chips button{border:1px solid var(--line);background:var(--solid);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600}
.fb .chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fb textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit;font-size:14.5px;background:var(--solid);color:var(--ink);resize:vertical}
.fb .act{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.fb .item{background:var(--solid);border-radius:9px;padding:9px 11px;margin-top:8px;font-size:14px}
.fb .item .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.fb .item .meta button{border:0;background:none;color:var(--muted);font-size:12px;padding:0}

/* Rail */
#rail{position:fixed;left:18px;right:18px;bottom:18px;height:52px;z-index:600;display:flex;align-items:center;gap:6px;
  background:var(--panel);backdrop-filter:blur(10px);border-radius:14px;padding:0 8px;box-shadow:0 6px 24px rgba(0,0,0,.3);transition:opacity .6s ease .3s}
#rail .home{border:0;background:none;padding:2px 6px;height:44px}
#rail .home img{height:40px;display:block}
#rail .chap{border:0;background:none;padding:6px 11px;border-radius:9px;font-family:var(--head);font-weight:600;font-size:17px;color:var(--muted);white-space:nowrap;transition:background .25s,color .25s}
#rail .chap.on{color:#fff;background:var(--orange)}
#rail .chap:hover:not(.on){color:var(--ink);background:var(--wash)}
#rail .chaps{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
#rail .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
#rail .icon{border:0;background:none;padding:7px 10px;border-radius:9px;font-size:14px;font-weight:600;white-space:nowrap}
#rail .icon:hover{background:var(--wash)}
#rail .icon.active{background:var(--ink);color:#fff}
.count{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--orange);color:#fff;font-size:12px;text-align:center;margin-left:4px}

/* Drawer */
#drawer{position:fixed;top:18px;right:18px;bottom:84px;width:470px;background:var(--panel);backdrop-filter:blur(10px);border-radius:16px;z-index:650;
  transform:translateX(calc(100% + 30px));transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#drawer.open{transform:none}
#drawer .dhead{padding:18px 20px 8px;display:flex;gap:10px;align-items:flex-start}
#drawer .dhead h2{font-size:34px;flex:1}
.x{border:0;background:var(--wash);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;flex:none}
#drawer .dbody{overflow-y:auto;padding:0 20px 20px;flex:1}
#drawer.open .dbody>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.media{background:#111;border-radius:10px;overflow:hidden;margin:6px 0 10px;position:relative}
.media img{width:100%;display:block;max-height:300px;object-fit:cover}
.media iframe{width:100%;aspect-ratio:16/10;border:0;display:block;background:#111}
.media .fail{padding:30px 16px;text-align:center;color:#ccc;font-size:14px}
.media .fail a{color:#FFB27A}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.btnrow a,.btnrow button{text-decoration:none;color:var(--ink)}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.thumbs img{width:64px;height:48px;object-fit:cover;border-radius:5px;cursor:pointer;opacity:.6;border:2px solid transparent}
.thumbs img.on{opacity:1;border-color:var(--orange)}
.placeholder{border:1.5px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);font-size:14px;margin:6px 0 12px}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--muted);margin:2px 0 8px}
.facts b{color:var(--ink)}

/* Editor */
.editor label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.editor input[type=text],.editor textarea,.editor select{width:100%;background:var(--solid);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:8px;font:inherit;font-size:14px}
.editor textarea{min-height:84px;resize:vertical}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-height:220px;overflow-y:auto}
.pick button{border:2px solid transparent;padding:0;border-radius:5px;overflow:hidden;background:var(--wash);aspect-ratio:4/3}
.pick button img{width:100%;height:100%;object-fit:cover;display:block}
.pick button.on{border-color:var(--orange)}
.inline{display:flex;gap:8px;align-items:center}

#editbar{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:700;background:var(--ink);color:#fff;border-radius:12px;padding:8px 10px;display:none;gap:8px;align-items:center;font-weight:600;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#editbar.on{display:flex}
#editbar button{background:rgba(255,255,255,.14);border:0;border-radius:8px;padding:6px 10px;color:#fff;font-weight:600}
#editbar button.go{background:var(--orange)}
#editbar .hint{padding:0 6px;max-width:340px}

/* Notes */
#notes{position:fixed;right:18px;bottom:84px;width:420px;max-height:62vh;background:var(--panel);backdrop-filter:blur(10px);border-radius:16px;z-index:660;display:none;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#notes.open{display:flex;animation:rise .35s ease both}
#notes .nh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
#notes .nh h3{margin:0;flex:1}
#notes .nl{overflow-y:auto;padding:6px 16px}
#notes .note{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
#notes .note .ctx{font-size:12px;color:var(--orange-deep);font-weight:700}
#notes .note .del{float:right;border:0;background:none;color:var(--muted);font-size:12px}
dialog{background:var(--solid);color:var(--ink);border:0;border-radius:16px;padding:20px;width:min(520px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,14,12,.5)}
dialog textarea{width:100%;min-height:110px;background:var(--wash);border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:10px;font:inherit}
dialog .ctx{color:var(--orange-deep);font-weight:700;font-size:14px;margin-bottom:8px}

.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.gallery button{border:0;padding:0;aspect-ratio:1;overflow:hidden;border-radius:7px;background:var(--wash)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.gallery button:hover img{transform:scale(1.06)}
#lightbox{position:fixed;inset:0;background:rgba(10,12,12,.95);z-index:900;display:none;align-items:center;justify-content:center}
#lightbox.open{display:flex;animation:fadein .3s ease}
@keyframes fadein{from{opacity:0}}
#lightbox img{max-width:92vw;max-height:86vh;border-radius:8px}
#lightbox .lbx{position:absolute;top:18px;right:22px;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:50%;width:42px;height:42px;font-size:20px}
#lightbox .lbn{position:absolute;top:50%;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:50%;width:48px;height:48px;font-size:22px}
#lightbox .prev{left:22px}#lightbox .next{right:22px}
#lightbox .cap{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#ccc;font-size:14px}

#savebar{position:fixed;top:18px;right:18px;z-index:720;display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:6px 6px 6px 12px;box-shadow:0 4px 14px rgba(0,0,0,.35);font-size:13px;font-weight:600;color:var(--tea);transition:right .35s cubic-bezier(.2,.8,.2,1)}
#savebar button{border:0;background:var(--orange);color:#fff;font-weight:700;border-radius:9px;padding:7px 12px;font-size:14px}
#savebar .flash{animation:flash .9s ease}
@keyframes flash{30%{color:var(--orange)}}
body.drawer-open #savebar{right:500px}
body.at-home #savebar{display:none}
#zoomer{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:720;display:flex;flex-direction:column;gap:6px;transition:right .35s cubic-bezier(.2,.8,.2,1)}
#zoomer button{width:46px;height:46px;border-radius:12px;border:0;background:#fff;color:var(--ink);font-size:24px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#zoomer button:hover{background:var(--orange);color:#fff}
body.drawer-open #zoomer{right:500px}
body.at-home #zoomer{opacity:0;pointer-events:none}
body:not(.at-home) #musicBtn{display:none}
.ridebtns{display:flex;flex-wrap:wrap;gap:6px}
.ridebtns .pbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
/* ---------- Click ripple, editing, toast, music ---------- */
.ripple{position:fixed;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid var(--orange);pointer-events:none;z-index:5000;animation:rip .55s ease-out forwards}
@keyframes rip{to{transform:scale(5);opacity:0}}
button:active,.row-btn:active,.clip:active{transform:scale(.97)}
body.edit #story .scroll *:not(.ed):not(button):not(input):not(textarea):hover,body.edit #drawer .dbody *:hover,body.edit #drawer .dhead h2:hover{outline:1px dashed rgba(255,102,0,.6);outline-offset:2px;cursor:text}
[contenteditable="true"].editing{outline:2px solid var(--orange)!important;background:#fff;border-radius:3px}
body.edit .ed{outline:1.5px dashed var(--orange);background:rgba(255,102,0,.07)}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%) translateY(-20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:3000;opacity:0;transition:.3s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
.musicbtn{position:fixed;right:22px;bottom:22px;z-index:2100;width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(0,0,0,.35);color:#fff;font-size:18px;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
.musicbtn:hover{border-color:var(--orange)}
.musicbtn .bars{display:flex;gap:2px;align-items:flex-end;height:16px}
.musicbtn .bars i{width:3px;background:#fff;animation:eq 1s ease-in-out infinite}
.musicbtn .bars i:nth-child(2){animation-delay:.2s}.musicbtn .bars i:nth-child(3){animation-delay:.4s}
.musicbtn.off .bars i{animation:none;height:3px!important}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
#ytHost{position:fixed;width:200px;height:113px;left:-400px;top:0;opacity:0;pointer-events:none}
.iconpick{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;background:#fff}
.rider-arrow{width:0;height:0}
.rider-arrow svg{display:block;transform-origin:50% 50%;margin:-11px 0 0 -11px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.rider-dot{width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--orange);border:3px solid #fff;box-shadow:0 0 0 5px rgba(255,102,0,.3)}
.rider-pulse{width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;border:4px solid var(--orange);animation:rpulse 1s ease infinite}
@keyframes rpulse{50%{box-shadow:0 0 0 12px rgba(255,102,0,0)}0%{box-shadow:0 0 0 0 rgba(255,102,0,.6)}}
/* road direction arrows, labels, gap road */
.dirarrow svg{display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.leglbl{display:inline-block;transform:translate(-50%,-50%);white-space:nowrap;font-family:var(--head);font-weight:700;font-size:14px;padding:3px 10px;border-radius:999px;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.leglbl.out{background:#FFD54A;color:#1d1d1d}.leglbl.ret{background:#00BCD4;color:#fff}
.gaplbl{display:inline-flex;align-items:center;gap:6px;transform:translate(-50%,-130%);white-space:nowrap;background:#FF2E88;color:#fff;font-family:var(--head);font-weight:700;font-size:18px;padding:5px 12px;border-radius:10px;border:2px solid #fff;box-shadow:0 0 0 4px rgba(255,46,136,.35),0 4px 14px rgba(0,0,0,.5);cursor:pointer;animation:gapglow 2s ease-in-out infinite}
@keyframes gapglow{50%{box-shadow:0 0 0 10px rgba(255,46,136,0),0 4px 14px rgba(0,0,0,.5)}}
.vidcluster{display:inline-flex;align-items:center;gap:6px;transform:translate(-50%,40%);white-space:nowrap;background:var(--sky);color:#fff;font-weight:700;font-size:13px;padding:5px 11px;border-radius:999px;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.45);cursor:pointer}
.hl-card{background:linear-gradient(135deg,#FFE3F0,#FFF1E6);border-radius:12px;padding:12px 14px;margin:14px 0}
.hl-card h3{margin:0 0 6px;color:#B0105E}
.hotelframe{width:100%;height:220px;border:0;border-radius:10px;display:block;margin:8px 0}
.homepick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:60vh;overflow:auto;margin:10px 0}
.homepick button{position:relative;border:3px solid transparent;padding:0;border-radius:6px;overflow:hidden;aspect-ratio:4/3;background:#eee}
.homepick button img{width:100%;height:100%;object-fit:cover;display:block}
.homepick button.on{border-color:var(--orange)}
.homepick button b{position:absolute;top:4px;left:4px;background:var(--orange);color:#fff;border-radius:50%;width:22px;height:22px;font-size:13px;display:flex;align-items:center;justify-content:center}
iframe.pv{width:100%;height:100%;border:0;display:block;pointer-events:none;background:#111;min-height:120px}
.media iframe.pv{height:300px}
.vtile{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2F86B5,#1d4f6e);color:#fff;font-size:28px}
.clip .th .vtile{font-size:22px}
/* HD video theatre */
#theatre{position:fixed;inset:0;background:rgba(6,8,8,.96);z-index:3500;display:none;flex-direction:column}
#theatre.open{display:flex;animation:fadein .3s ease}
#theatre .th-head{display:flex;align-items:center;gap:10px;padding:12px 18px;color:#fff}
#theatre .th-head h3{color:#fff;margin:0;flex:1;font-size:24px}
#theatre .seg{display:inline-flex;background:rgba(255,255,255,.12);border-radius:10px;padding:3px}
#theatre .seg button{border:0;background:none;color:#ddd;padding:7px 12px;border-radius:8px;font-weight:700;font-size:14px}
#theatre .seg button.on{background:var(--orange);color:#fff}
#theatre .th-close{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:50%;width:42px;height:42px;font-size:20px}
#theatre .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:0 18px 12px;min-height:0}
#theatre video,#theatre iframe{width:100%;height:100%;max-height:100%;border:0;background:#000;border-radius:8px}
#theatre .th-note{color:#bbb;font-size:13px;text-align:center;padding:0 18px 14px}
.playhd{z-index:2;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:0;background:var(--orange);color:#fff;font-weight:700;font-size:16px;padding:12px 20px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.vposter{position:relative;aspect-ratio:16/9;background:#111;border-radius:10px;overflow:hidden;margin:6px 0 10px;cursor:pointer}
.vposter img,.vposter iframe{width:100%;height:100%;object-fit:cover;display:block}
.gday{font-family:var(--head);font-size:20px;font-weight:700;margin:18px 0 0}
.unplaced{font-size:11px;font-weight:700;color:var(--sky);display:block}
/* ---------- Map markers ---------- */
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{scale:0;opacity:0}}
.callout{position:relative;width:0;height:0}
.callout .arrow{position:absolute;left:0;bottom:0;overflow:visible}
.callout .lbl{position:absolute;white-space:nowrap;background:#fff;color:var(--ink);font-family:var(--head);font-weight:700;font-size:16px;line-height:1;padding:6px 9px 6px 8px;border-radius:8px;border-left:5px solid var(--orange);box-shadow:0 4px 14px rgba(0,0,0,.45);display:flex;align-items:center;gap:6px;transition:background .3s,color .3s,border-color .3s,transform .3s}
.callout.r .lbl{left:34px;bottom:30px}.callout.l .lbl{right:34px;bottom:30px;border-left:0;border-right:5px solid var(--orange)}
.callout .lbl .chillies svg{width:14px;height:14px}
.callout .dot{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--orange);border:3px solid #fff;box-shadow:0 0 0 3px rgba(255,102,0,.35)}
.callout.upcoming .lbl{background:#f1f1f1;color:#777;border-color:#bbb}
.callout.upcoming .dot{background:#999}
.callout.active .lbl{background:#E53935;color:#fff;border-color:#8E0000;transform:scale(1.15)}
.callout.active .dot{background:#E53935;animation:pulse .7s ease infinite}
.callout.done .lbl{background:#2E7D32;color:#fff;border-color:#1B5E20}
.callout.done .lbl::after{content:"✓";font-size:15px}
.callout.done .dot{background:#2E7D32}
.callout.unconf .dot{outline:2px dashed #fff;outline-offset:3px}
.callout.small .lbl{font-size:13.5px;border-left-color:var(--tea);padding:4px 7px}
.callout.small.l .lbl{border-right-color:var(--tea)}
.callout.small .dot{background:var(--tea);width:12px;height:12px;left:-6px;top:-6px}
.callout.birch .lbl{border-color:#111}.callout.birch .dot{background:#fff;border-color:#111}
@keyframes pulse{50%{transform:scale(1.6)}}
.stop{display:flex;align-items:center;gap:8px;transform:translate(-22px,-22px)}
.stop .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.5);flex:none}
.stop.base .ic{background:var(--ink)}.stop.pace .ic{background:var(--tea)}
.stop .tx2{background:#fff;border-radius:8px;padding:4px 9px;box-shadow:0 4px 14px rgba(0,0,0,.45);white-space:nowrap}
.stop .tx2 b{display:block;font-family:var(--head);font-size:17px;line-height:1.05}
.stop .tx2 small{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.stop.base .tx2 small{color:var(--orange-deep)}.stop.pace .tx2 small{color:var(--tea)}
.looplbl{background:var(--loop1);color:#fff;font-family:var(--head);font-weight:700;font-size:16px;padding:4px 10px;border-radius:999px;white-space:nowrap;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.45);transform:translate(-50%,-50%);display:inline-block}
.looplbl.l2{background:var(--loop2)}
.roadlbl{background:#1d1d1d;color:var(--road);font-family:var(--head);font-weight:700;font-size:14px;padding:3px 9px;border-radius:999px;white-space:nowrap;border:2px solid var(--road);transform:translate(-50%,-50%);display:inline-block;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.pin-video{width:22px;height:22px;border-radius:50%;background:var(--sky);color:#fff;font-size:10px;border:2px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.pin-photo{width:24px;height:24px;border-radius:50%;background:#8A6FD1;color:#fff;font-size:12px;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.estate-pin{background:#fff;color:var(--ink);font-family:var(--head);font-weight:700;font-size:19px;padding:5px 12px 5px 10px;border-radius:10px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.45);border-left:5px solid var(--orange);cursor:pointer;transition:transform .2s}
.estate-pin:hover{transform:scale(1.06)}
.estate-pin small{display:block;font-family:var(--body);font-weight:600;font-size:12px;color:var(--muted)}
.town{color:#fff;font-family:var(--head);font-weight:700;font-size:18px;text-shadow:0 1px 4px #000,0 0 8px #000;white-space:nowrap}
.bike{transform:translate(-30px,-34px);filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.bike svg{display:block;transition:transform .2s}
.bike.west svg{transform:scaleX(-1)}
.bike .tagx{display:block;margin:-2px auto 0;width:max-content;background:var(--orange);color:#fff;font-family:var(--head);font-weight:700;font-size:11px;padding:1px 6px;border-radius:4px}
.leaflet-container{font-family:var(--body);background:#0d1410}
.leaflet-control-attribution{font-size:10px}
.leaflet-top.leaflet-right{top:12px;right:12px}
.leaflet-tooltip.tt{background:var(--ink);color:#fff;border:0;font-weight:600;font-size:13px;border-radius:7px}
.leaflet-tooltip.tt::before{display:none}
.leaflet-interactive{cursor:pointer}

@media (max-width:820px){
  #story{top:auto;left:8px;right:8px;width:auto;height:48vh;bottom:68px}
  #drawer{left:8px;right:8px;width:auto;top:8px;bottom:68px}
  #rail{left:8px;right:8px;bottom:8px}
  .cover-title{font-size:52px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

function makeTextEditable(root,prefix){
  const SKIP='.fb,.clips,.row-btn,.gallery,.playbar,.stats,.legend,.addclips,.hero,.ladder,.editor,button,[data-auto],.ed';
  const INLINE=new Set(['B','I','EM','STRONG','BR']);
  const cands=[];
  root.querySelectorAll('h1,h2,h3,p,li,span,div,b').forEach(el=>{
    if(el.closest(SKIP)) return;
    if(cands.some(c=>c.contains(el))) return;
    if(!el.textContent.trim()) return;
    if([...el.children].some(c=>!INLINE.has(c.tagName))) return;
    cands.push(el);
  });
  cands.forEach((el,i)=>{const k=prefix+':'+i;el.dataset.tk=k;el.classList.add('tx');if(TEXT[k]!=null)el.innerHTML=TEXT[k];if(editing)el.contentEditable='true'});

function profileSVG(d){
  const pr=T3[d].prof; if(!pr.length) return '';
  const W=360,H=84,maxx=pr[pr.length-1][0],ys=pr.map(p=>p[1]),mn=Math.min(...ys),mx=Math.max(...ys);
  const X=x=>x/maxx*W, Y=y=>H-6-(y-mn)/(mx-mn||1)*(H-22);
  const line=pr.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  return `<div class="profile"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Elevation profile from ${mn} to ${mx} metres">
  <defs><linearGradient id="pg${d}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FF6600" stop-opacity=".35"/><stop offset="1" stop-color="#FF6600" stop-opacity=".03"/></linearGradient></defs>
  <path d="${line} L${W} ${H} L0 ${H}Z" fill="url(#pg${d})"/><path d="${line}" fill="none" stroke="#FF6600" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
  <div class="small muted">Recce elevation: ${mn.toLocaleString()} m to ${mx.toLocaleString()} m (phone GPS, approximate)</div></div>`;
}

function loopOf(p){ /* which loop a pin sits on: nearest point in either loop */
  let best=[1e18,0];
  T3[p.day]?.loops.forEach((L,i)=>L.segs.forEach(s=>s.forEach(q=>{const dd=(q[0]-p.lat)**2+(q[1]-p.lng)**2;if(dd<best[0])best=[dd,i+1]})));
  return best[1];
}

}

const parseDrive=s=>{s=(s||'').trim();const m=s.match(/\/d\/([\w-]{20,})/)||s.match(/[?&]id=([\w-]{20,})/);return m?m[1]:(/^[\w-]{20,}$/.test(s)?s:'')};
function addClips(d,text){
  let added=0;
  text.split(/\n+/).forEach(line=>{
    const id=parseDrive((line.match(/https?:\/\/\S+/)||[line.trim().split(/\s+/).pop()])[0]); if(!id||allVideos().some(v=>v.id===id)) return;
    const m=line.match(/(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/);
    let v={id,day:d,n:0,t:'',dur:0,lat:STOPS['pace'+d].ll[0],lng:STOPS['pace'+d].ll[1],gap:99,km:0,seg:[],name:''};
    if(m){
      v.t=`${m[4]}:${m[5]}`;
      const utc=Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6])/1000-19800;
      const tt=T3[d].tt; let best=tt[0];
      tt.forEach(q=>{if(Math.abs(q[2]-utc)<Math.abs(best[2]-utc))best=q});
      v.lat=best[0];v.lng=best[1];v.gap=Math.round((best[2]-utc)/6)/10;
    } else {v.name=`Day ${d} clip ${extraClips.filter(x=>x.day===d).length+1}`;v.t='12:00'}
    extraClips.push(v);added++;
  });
  store.set(LS.extra,extraClips);
  return added;
}

/* ---------- Geometry helpers ---------- */
function hv(a,b){const R=6371000,r=Math.PI/180,dl=(b[0]-a[0])*r,dg=(b[1]-a[1])*r,x=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function pathLen(p){let s=0;for(let i=1;i<p.length;i++)s+=hv(p[i-1],p[i]);return s}
function pointAt(p,d){let s=0;for(let i=1;i<p.length;i++){const k=hv(p[i-1],p[i]);if(s+k>=d){const f=k?(d-s)/k:0;return [p[i-1][0]+(p[i][0]-p[i-1][0])*f,p[i-1][1]+(p[i][1]-p[i-1][1])*f]}s+=k}return p[p.length-1]}
function bearing(a,b){return Math.atan2((b[1]-a[1])*Math.cos(a[0]*Math.PI/180),b[0]-a[0])*180/Math.PI}

const legLayer=L.layerGroup().addTo(map);
const legLines={};
function legCoords(l){return [STOPS[l.from].ll,...l.vias,STOPS[l.to].ll]}
function smoothLine(pts,n=10){const out=[],P=[pts[0],...pts,pts[pts.length-1]];for(let i=1;i<P.length-2;i++){const [p0,p1,p2,p3]=[P[i-1],P[i],P[i+1],P[i+2]];for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;out.push([0,1].map(j=>.5*((2*p1[j])+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3)))}}out.push(pts[pts.length-1]);return out}
async function rerouteLeg(l){l.geom=smoothLine(legCoords(l));l.approx=true;drawLeg(l);await routeLeg(l)}
function drawLeg(l){
  if(legLines[l.id]){legLayer.removeLayer(legLines[l.id].g);if(legLines[l.id].deco)map.removeLayer(legLines[l.id].deco);delete legLines[l.id]}
  if(!l.geom){if(l.id==='d2on')drawGap();return}
  const pts=l.geom;
  const casing=L.polyline(pts,{color:'#1d1d1d',weight:8,opacity:.75,interactive:false});
  const col=l.dir==='ret'?'#00BCD4':'#FFD54A';
  const line=L.polyline(pts,{color:col,weight:4.5,opacity:1,dashArray:l.geom?null:'8 8'});
  line.on('click',e=>{L.DomEvent.stop(e);openLocation(e.latlng,l)});
  line.bindTooltip(()=>`${l.name}${l.geom?'':' (loading road route…)'} · click to see this spot`,{sticky:true,className:'tt'});
  const g=L.layerGroup([casing,line]).addTo(legLayer);
  const deco=L.layerGroup();
  const total=pathLen(pts),step=total>20000?4500:total>4000?1200:350;
  for(let s=step/2;s<total;s+=step){const a=pointAt(pts,s),b=pointAt(pts,s+30);const br=bearing(a,b);
    deco.addLayer(L.marker(a,{interactive:false,icon:L.divIcon({className:'dirarrow',iconSize:[16,16],iconAnchor:[8,8],html:`<svg width="16" height="16" viewBox="0 0 16 16" style="transform:rotate(${br}deg)"><path d="M8 1 L14 13 L8 10 L2 13Z" fill="${col}" stroke="#1d1d1d" stroke-width="1.4" stroke-linejoin="round"/></svg>`})}))}
  const mid=pointAt(pts,total*(l.dir==='ret'?.62:.38));
  deco.addLayer(L.marker(mid,{zIndexOffset:700,icon:L.divIcon({className:'',iconSize:[0,0],html:`<div class="leglbl ${l.dir} pop">${esc(l.lbl)}${l.km?` · ${Math.round(l.km)} km`:''}</div>`})}).on('click',()=>openLocation(L.latLng(mid[0],mid[1]),l,true)));
  legLines[l.id]={g,line,casing,deco};
  styleDay(); if(l.id==='d2on') drawGap();
}

const RKEY='ktm-kerala-2027-route:';
const ROUTERS=['https://routing.openstreetmap.de/routed-car/route/v1/driving/','https://router.project-osrm.org/route/v1/driving/'];
async function routeLeg(l){
  const coords=legCoords(l),sig=coords.map(c=>c.map(x=>x.toFixed(4)).join(',')).join(';');
  const cached=store.get(RKEY+l.id,null);
  if(cached&&cached.sig===sig&&cached.geom&&cached.geom.length>coords.length+5){applyRoute(l,cached);return true}
  for(const base of ROUTERS){
    try{
      const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),15000);
      const r=await fetch(`${base}${coords.map(c=>c[1]+','+c[0]).join(';')}?overview=full&geometries=geojson`,{signal:ctl.signal});clearTimeout(to);
      const j=await r.json(); if(j.code!=='Ok') throw new Error(j.code);
      const res={sig,geom:j.routes[0].geometry.coordinates.map(c=>[+c[1].toFixed(5),+c[0].toFixed(5)]),km:j.routes[0].distance/1000,min:j.routes[0].duration/60};
      store.set(RKEY+l.id,res); applyRoute(l,res); return true;
    }catch(e){}
  }
  l.failed=true; return false;
}
function applyRoute(l,res){
  l.geom=res.geom;l.km=res.km;l.min=res.min;l.approx=false;
  if(!userSet.has(l.key)){VALS[l.key]=String(Math.round(res.km));document.querySelectorAll(`.ed[data-k="${l.key}"]`).forEach(e=>e.textContent=VALS[l.key]);refreshAutos()}
  drawLeg(l); drawStops();
}
async function routeAll(tries=0){let ok=true;for(const l of LEGS){if(l.geom&&!l.approx)continue;if(l.id.startsWith('d3'))continue;if(!(await routeLeg(l)))ok=false;await new Promise(r=>setTimeout(r,300))}
  if(!ok&&tries<2)setTimeout(()=>routeAll(tries+1),20000)}

let TMAP=store.get(LS.tmap,{});
const textNodesOf=root=>{const out=[],w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())if(n.nodeValue.trim())out.push(n);return out};
function applyTMap(root){
  if(!root||!Object.keys(TMAP).length) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return p&&!p.closest('script,style,textarea,.ed,[data-auto],.editing')?1:2}});

}
new MutationObserver(ms=>{for(const m of ms)m.addedNodes.forEach(nd=>{if(nd.nodeType===1)applyTMap(nd);else if(nd.nodeType===3&&nd.parentNode)applyTMap(nd.parentNode)})}).observe(document.body,{childList:true,subtree:true});
function beginEdit(el){
  if(el.isContentEditable) return;
  const nodes=textNodesOf(el);nodes.forEach(n=>{if(n.__o==null)n.__o=n.nodeValue});
  el.__nodes=nodes;el.__single=nodes.length===1?nodes[0].__o.trim():null;
  el.contentEditable='true';el.classList.add('editing');el.focus();
  const sel=getSelection(),rg=document.createRange();rg.selectNodeContents(el);rg.collapse(false);sel.removeAllRanges();sel.addRange(rg);
  el.addEventListener('blur',()=>endEdit(el),{once:true});
  el.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();el.blur()}if(ev.key==='Escape'){el.blur()}});
}
function endEdit(el){
  el.removeAttribute('contenteditable');el.classList.remove('editing');
  let changed=false;
  (el.__nodes||[]).forEach(n=>{if(!n.isConnected||!el.contains(n))return;const k=n.__o.trim(),nv=n.nodeValue.trim(),cur=TMAP[k]??k;
    if(nv&&nv!==cur){if(nv===k)delete TMAP[k];else TMAP[k]=nv;changed=true}});
  if(!changed&&el.__single){const nv=el.textContent.trim(),cur=TMAP[el.__single]??el.__single;if(nv&&nv!==cur){TMAP[el.__single]=nv;changed=true}}
  if(changed){store.set(LS.tmap,TMAP);applyTMap(document.body);toast('Saved')}
}
const EDIT_SKIP='#editbar,input,textarea,select,.ed,[data-auto],.leaflet-container,#lightbox,dialog,.x,.pick,a,iframe,.media,.thumbs,.gallery,.clip .th,svg,img,.foot,#musicBtn';

function inlineInput(el){
  const nodes=textNodesOf(el); if(!nodes.length) return;
  const n=nodes[0]; if(n.__o==null) n.__o=n.nodeValue;
  const k=n.__o.trim(), r=el.getBoundingClientRect();
  const inp=document.createElement('input');inp.value=n.nodeValue.trim();
  Object.assign(inp.style,{position:'fixed',left:r.left-4+'px',top:r.top-4+'px',width:Math.max(r.width+40,180)+'px',height:r.height+8+'px',zIndex:4000,font:getComputedStyle(el).font,border:'2px solid #FF6600',borderRadius:'6px',padding:'0 6px',background:'#fff',color:'#22282B'});

const Synth=(()=>{
  let ctx,master,fx,timer=null,step=0,nextT=0,noiseBuf;
  const bpm=112,s16=60/bpm/4,mtof=m=>440*Math.pow(2,(m-69)/12);
  const chords=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],bass=[45,41,36,43];

    ctx=new (window.AudioContext||window.webkitAudioContext)();

    const dl=ctx.createDelay(1);dl.delayTime.value=s16*3;const fb=ctx.createGain();fb.gain.value=.32;const wet=ctx.createGain();wet.gain.value=.5;
    fx=ctx.createGain();fx.connect(master);fx.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(master);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*.5,ctx.sampleRate);const n=noiseBuf.getChannelData(0);for(let i=0;i<n.length;i++)n[i]=Math.random()*2-1;

  const noise=(t,d,hp,v)=>{const s=ctx.createBufferSource();s.buffer=noiseBuf;const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=ctx.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d)};
  const tone=(t,m,d,type,v,cut,dest)=>{const o=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();o.type=type;o.frequency.value=mtof(m);f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(f);f.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+.05)};
  const pad=(t,ch,d)=>ch.forEach(m=>[-6,6].forEach(det=>{const o=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();o.type='sawtooth';o.frequency.value=mtof(m);o.detune.value=det;f.type='lowpass';f.frequency.value=1000;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.03,t+.9);g.gain.linearRampToValueAtTime(0,t+d);o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+d+.1)}));

    while(nextT<ctx.currentTime+.2){
      const t=nextT,s=step%16,bar=Math.floor(step/16),ch=chords[bar%4],intro=bar<2;

  }
  return{
    running(){return !!ctx&&ctx.state==='running'},
    play(){if(!ctx)init();ctx.resume();if(timer)return;step=0;nextT=ctx.currentTime+.05;timer=setInterval(sched,25);

function drawHomeRoute(){
  const svg=document.getElementById('homeRoute'),W=innerWidth,H=innerHeight;
  const G=id=>{const l=LEGS.find(x=>x.id===id);const c=l.geom||(store.get(RKEY+id,null)||{}).geom;return c&&c.length>5?c.filter((p,i)=>i%4===0):[STOPS[l.from].ll,...l.vias,STOPS[l.to].ll]};
  const pts=[...G('d1out'),...G('d1back'),...G('d2out'),...G('d2on'),STOPS.pace3.ll];
  const lats=pts.map(p=>p[0]),lngs=pts.map(p=>p[1]),la0=Math.min(...lats),la1=Math.max(...lats),lo0=Math.min(...lngs),lo1=Math.max(...lngs);
  const s=Math.min(W*.8/(lo1-lo0),H*.78/(la1-la0)),ox=(W-(lo1-lo0)*s)/2,oy=(H-(la1-la0)*s)/2;
  const P=p=>[ox+(p[1]-lo0)*s,oy+(la1-p[0])*s];
  const d='M'+pts.map(p=>P(p).map(v=>v.toFixed(1)).join(' ')).join(' L');
  const dots=[STOPS.marriott.ll,STOPS.pace1.ll,STOPS.pace2.ll,STOPS.pace3.ll].map((p,i)=>{const [x,y]=P(p);return `<circle cx="${x}" cy="${y}" r="7"><animate attributeName="r" values="6;10;6" dur="2s" begin="${i*.4}s" repeatCount="indefinite"/></circle>`}).join('');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.innerHTML=`<path class="rtbg" d="${d}"/><path id="hrPath" class="rt" d="${d}"/>${dots}<g><path d="M-9 -8 L11 0 L-9 8 L-4 0Z" fill="#fff" stroke="#FF6600" stroke-width="2"/><animateMotion dur="9s" repeatCount="indefinite" rotate="auto"><mpath href="#hrPath"/></animateMotion></g>`;
  const p=document.getElementById('hrPath'),len=p.getTotalLength();
  p.style.strokeDasharray=len;p.style.strokeDashoffset=len;
  p.animate([{strokeDashoffset:len},{strokeDashoffset:0}],{duration:9000,iterations:Infinity});
}

const directSrc=id=>`https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t`;
let thId=null,thQ='orig',thWatch=null;
function openTheatre(id,q){
  thId=id;thQ=q||'orig';const v=allVideos().find(x=>x.id===id);
  document.getElementById('thTitle').textContent=v?vTitle(v):'Recce video';
  document.querySelectorAll('#theatre [data-q]').forEach(b=>b.classList.toggle('on',b.dataset.q===thQ));
  const st=document.getElementById('thStage'),note=document.getElementById('thNote');clearTimeout(thWatch);
  if(thQ==='orig'){
    st.innerHTML=`<video controls autoplay playsinline preload="auto" src="${directSrc(id)}"></video>`;
    note.textContent='Playing the original file at its full recorded resolution (1080p or higher). Large clips take a few seconds to start.';
    const vd=st.querySelector('video');let started=false;
    vd.addEventListener('playing',()=>{started=true});
    vd.addEventListener('error',()=>fallback('This file can’t be streamed directly in this browser'));
    thWatch=setTimeout(()=>{if(!started&&vd.readyState<2)fallback('The original file is taking too long to start')},15000);
  } else {
    st.innerHTML=`<iframe src="${vidEmbed(id)}" allow="autoplay; fullscreen" allowfullscreen title="Recce video"></iframe>`;
    note.textContent='Google Drive’s player picks the quality itself. Click ⚙ in the player and choose 1080p (or 720p). The large player here lets Drive offer its highest quality.';
  }
  document.getElementById('theatre').classList.add('open');
  function fallback(why){if(thId!==id||thQ!=='orig')return;openTheatre(id,'drive');note.textContent=why+', so it switched to Google Drive’s player. Click ⚙ and choose 1080p.'}
}

  openId='clips:'+d;highlight.clearLayers();
  const vs=allVideos().filter(v=>v.day===d);
  showDrawer(`${DAYNAME[d]} recce videos`,`<p class="kicker" style="font-size:17px">${vs.length} clips · click one to play it</p>
   <div class="gallery" style="grid-template-columns:repeat(2,1fr)">${vs.map(v=>`<button data-vid="${v.id}" style="aspect-ratio:16/10;position:relative"><img src="${img(v.id,400)}" alt="" style="width:100%;height:100%;object-fit:cover" onerror="this.outerHTML='<div class=&quot;vtile&quot;>▶</div>'"><span style="position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:600;padding:2px 6px;border-radius:5px">▶ ${esc(vTitle(v))}</span></button>`).join('')}</div>`);
  document.querySelectorAll('#dBody [data-vid]').forEach(b=>b.onclick=()=>openVideo(b.dataset.vid));
}
function mediaHTML(p){
  let h='';
  if(p.clip) h+=videoBlock(p.clip);
  if(p.photos.length){h+=`<div class="media" id="mainPhoto" style="cursor:zoom-in">${imgTag(p.photos[mediaIdx]||p.photos[0],1600)}</div>`;
    if(p.photos.length>1) h+=`<div class="thumbs">${p.photos.map((id,i)=>`<img src="${img(id,200)}" class="${i===mediaIdx?'on':''}" data-mi="${i}" alt="${esc(photoName(id))}">`).join('')}</div>`}
  return h;
}
function openPin(id,fly=false){
  const p=pins.find(x=>x.id===id); if(!p) return;
  if(openId!==id) mediaIdx=0; openId=id; highlight.clearLayers();
  const typeLabel={chilli:RATING[p.rating]||'Chilli',highlight:'Highlight',birch:'Chris Birch instruction stage',view:'Scenic stop',photo:'Recce photo'}[p.type]||'Point';
  const loop=(p.type==='chilli'||p.type==='birch'||p.type==='highlight')?loopOf(p):0;
  let h=`<p class="kicker" style="font-size:17px">${DAYNAME[p.day]} · ${typeLabel} ${p.type==='chilli'?chillies(p.rating):''}${loop?`<span class="tag ${loop===1?'l1':'l2'}">Loop ${loop}</span>`:''}${p.birch?'<span class="tag">Chris Birch stage</span>':''}</p>`;
  h+=mediaHTML(p);
  h+=`<p data-pfield="text" data-pid="${p.id}" class="${editing?'tx':''}" ${editing?'contenteditable="true"':''}>${esc(p.text)}</p>`;
  h+=`<h3 style="margin-top:14px">What this spot looks like</h3>${lookBlock(p.lat,p.lng,17)}`;
  if(!p.confirmed&&p.type!=='view') h+=`<p class="small muted">Position is approximate until placed in Edit mode.</p>`;
  h+=`<div class="btnrow"><button class="pbtn" id="pinNote">Add note about this</button></div>`;
  if(editing) h+=editorHTML(p);
  showDrawer(`<span data-pfield="name" data-pid="${p.id}" class="${editing?'tx':''}">${esc(p.name)}</span>`,h);
  if(fly||!map.getBounds().contains([p.lat,p.lng])) map.flyTo([p.lat,p.lng],Math.max(map.getZoom(),15.5),{duration:.9});
  bindDrawer(p);
}
function closeDrawer(){drawer.classList.remove('open');document.body.classList.remove('drawer-open');openId=null;highlight.clearLayers()}
document.getElementById('dClose').onclick=closeDrawer;
function bindDrawer(p){
  const db=document.getElementById('dBody');
  db.querySelectorAll('[data-mi]').forEach(x=>x.onclick=()=>{mediaIdx=+x.dataset.mi;openPin(p.id)});
  const mp=document.getElementById('mainPhoto'); if(mp) mp.onclick=()=>openLB(PHOTOS.findIndex(x=>x[0]===p.photos[mediaIdx]));
  document.getElementById('pinNote').onclick=()=>openNote(`${DAYNAME[p.day]} · ${p.name}`,p.day);
  if(!editing) return;
  const f=n=>db.querySelector(`[name=${n}]`);
  const upd=()=>{p.type=f('type').value;p.rating=+f('rating').value;p.birch=f('birch').checked;p.day=+f('day').value;p.confirmed=f('confirmed').checked;savePins();drawPins();rerender()};
  ['type','rating','day','birch','confirmed'].forEach(n=>f(n).addEventListener('change',()=>{upd();openPin(p.id)}));
  f('clip').addEventListener('change',()=>{p.clip=f('clip').value;savePins();openPin(p.id);rerender()});
  f('cliplink').addEventListener('change',()=>{const id=parseDrive(f('cliplink').value);if(id){p.clip=id;savePins();openPin(p.id);rerender()}else if(f('cliplink').value.trim())alert('That doesn’t look like a Google Drive file link.')});
  db.querySelectorAll('.pick button').forEach(b=>b.onclick=()=>{const id=b.dataset.id,i=p.photos.indexOf(id);if(i>=0)p.photos.splice(i,1);else p.photos.push(id);savePins();openPin(p.id)});
  db.querySelector('#delPin').onclick=()=>{if(confirm(`Delete “${p.name}”?`)){pins=pins.filter(x=>x!==p);savePins();closeDrawer();drawPins();rerender()}};
}
function editorHTML(p){
  const vs=allVideos().filter(v=>v.day===p.day);
  return `<div class="editor" style="margin-top:18px;border-top:1px solid var(--line);padding-top:6px">
   <h3>Edit pin</h3><p class="small muted">Click the title or description above to change the wording.</p>
   <div class="two" style="gap:10px"><div><label>Type</label><select name="type">${['chilli','highlight','birch','view','photo'].map(x=>`<option value="${x}" ${x===p.type?'selected':''}>${{chilli:'Chilli',highlight:'Highlight',birch:'Chris Birch stage',view:'Scenic stop',photo:'Photo spot'}[x]}</option>`).join('')}</select></div>
   <div><label>Rating</label><select name="rating">${[0,1,2,3].map(r=>`<option value="${r}" ${r===p.rating?'selected':''}>${r?RATING[r]:'None'}</option>`).join('')}</select></div></div>
   <div class="two" style="gap:10px"><div><label>Day</label><select name="day">${[1,2,3].map(d=>`<option value="${d}" ${d===p.day?'selected':''}>Day ${d}</option>`).join('')}</select></div>
   <div><label>&nbsp;</label><label class="inline" style="color:var(--ink)"><input type="checkbox" name="birch" ${p.birch?'checked':''}> Chris Birch stage</label></div></div>
   <label>Video: pick a recce clip from ${DAYNAME[p.day]}</label>
   <select name="clip"><option value="">No video</option>${vs.map(v=>`<option value="${v.id}" ${v.id===p.clip?'selected':''}>${esc(vTitle(v))}${v.dur?` (${v.dur} min)`:''}</option>`).join('')}${p.clip&&!vs.some(v=>v.id===p.clip)?`<option value="${p.clip}" selected>Linked Drive video</option>`:''}</select>
   <label>…or paste any Google Drive video link</label><input type="text" name="cliplink" placeholder="https://drive.google.com/file/d/…">
   <label>Photos (click to attach or remove)</label>
   <div class="pick">${PHOTOS.map(ph=>`<button data-id="${ph[0]}" class="${p.photos.includes(ph[0])?'on':''}" title="${esc(ph[1])}"><img src="${img(ph[0],200)}" loading="lazy" alt="${esc(ph[1])}"></button>`).join('')}</div>
   <label class="inline" style="color:var(--ink);margin-top:12px"><input type="checkbox" name="confirmed" ${p.confirmed?'checked':''}> Position confirmed (dragging a pin also confirms it)</label>
   <div class="inline" style="margin-top:14px"><button class="pbtn" id="delPin">Delete pin</button></div></div>`;
}

/* ---------- Edit mode ---------- */
const editBtn=document.getElementById('editBtn'),editbar=document.getElementById('editbar');
function toggleEdit(on=!editing){
  editing=on; document.body.classList.toggle('edit',editing); editbar.classList.toggle('on',editing); editBtn.classList.toggle('active',editing);
  stopRide(); rerender(); drawPins(); drawStops(); toast(editing?'Edit mode: click any text to change it':'Edit mode off');
  if(openId){const [k,v]=openId.includes(':')?openId.split(/:(.+)/):[null,openId];
    if(!k)openPin(openId);else if(k==='v')openVideo(v);else if(k==='stop')openStop(v);else closeDrawer()}
}
editBtn.onclick=()=>toggleEdit();
document.getElementById('doneEdit').onclick=()=>toggleEdit(false);
let adding=false; const HINT='Edit mode: click any outlined text or number to change it. Drag pins, camps and chillies to move them; click a pin to edit it.';
document.getElementById('addPinBtn').onclick=()=>{adding=true;document.getElementById('editHint').textContent='Click on the map where the new pin goes.';map.getContainer().style.cursor='crosshair'};
map.on('click',e=>{
  if(placingClip){const id=placingClip;placingClip=null;map.getContainer().style.cursor='';CLIPPOS[id]=[+e.latlng.lat.toFixed(6),+e.latlng.lng.toFixed(6)];store.set(LS.clippos,CLIPPOS);drawPins();rerender();openVideo(id);toast('Clip placed');return}
  if(!adding) return; adding=false; map.getContainer().style.cursor=''; document.getElementById('editHint').textContent=HINT;
  const p=P('pin'+Date.now(),currentDay||1,'highlight','New pin',0,+e.latlng.lat.toFixed(6),+e.latlng.lng.toFixed(6),'Describe this spot.',{confirmed:true});
  pins.push(p);savePins();drawPins();rerender();openPin(p.id);
});
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function backupJSON(){const vals={};userSet.forEach(k=>vals[k]=VALS[k]);return JSON.stringify({pins,notes,values:vals,textmap:TMAP,stops:store.get(LS.stops,{}),clips:extraClips,clippos:CLIPPOS,vias:store.get(LS.vias,{})},null,1)}
document.getElementById('saveBtn').onclick=()=>{try{store.set(LS.notes,notes);savePins();saveVals();store.set(LS.tmap,TMAP)}catch(e){}const d=new Date().toISOString().slice(0,10);download(`KTM-Kerala-2027-notes-and-changes-${d}.json`,backupJSON(),'application/json');toast('Saved. Everything is kept in this browser, and a backup copy was downloaded.')};
document.getElementById('exportBtn').onclick=()=>{const vals={};userSet.forEach(k=>vals[k]=VALS[k]);download('ktm-kerala-layout.json',JSON.stringify({pins,notes,values:vals,textmap:TMAP,stops:store.get(LS.stops,{}),clips:extraClips,clippos:CLIPPOS,vias:store.get(LS.vias,{})},null,1),'application/json')};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);
  if(Array.isArray(j.pins)){pins=j.pins.map(p=>({clip:'',photos:[],...p}));savePins()}
  if(Array.isArray(j.notes)){notes=j.notes;store.set(LS.notes,notes);renderNotes()}
  if(j.values&&typeof j.values==='object'){VALS=Object.assign({},DEFAULT_VALUES,j.values);Object.keys(j.values).forEach(k=>userSet.add(k));saveVals()}
  if(j.text&&typeof j.text==='object'){TEXT=j.text;store.set(LS.text,TEXT)}
  if(j.stops&&typeof j.stops==='object'){Object.entries(j.stops).forEach(([k,ll])=>{if(STOPS[k])STOPS[k].ll=ll});saveStops();LEGS.forEach(l=>{l.geom=null;drawLeg(l);routeLeg(l)})}
  if(Array.isArray(j.clips)){extraClips=j.clips;store.set(LS.extra,extraClips)}
  if(j.textmap&&typeof j.textmap==='object'){TMAP=j.textmap;store.set(LS.tmap,TMAP);applyTMap(document.body)}
  if(j.clippos&&typeof j.clippos==='object'){CLIPPOS=j.clippos;store.set(LS.clippos,CLIPPOS)}
  if(j.vias&&typeof j.vias==='object'){store.set(LS.vias,j.vias);Object.entries(j.vias).forEach(([id,v])=>{const l=LEGS.find(x=>x.id===id);if(l){l.vias=v;rerouteLeg(l)}})}
  drawPins();drawStops();rerender();alert('Layout loaded.')}catch(err){alert('That file isn’t a layout file saved from this presentation.')}};r.readAsText(f);e.target.value=''};
document.getElementById('resetBtn').onclick=()=>{if(confirm('Reset all pins and camps to their original positions? Your text, values, notes and feedback are kept.')){pins=JSON.parse(JSON.stringify(DEFAULT_PINS));savePins();STOPS=JSON.parse(JSON.stringify(DEFAULT_STOPS));saveStops();LEGS.forEach(l=>{if(T3.roads[l.id]){l.geom=T3.roads[l.id];l.approx=true;drawLeg(l)}});closeDrawer();drawPins();drawStops();rerender()}};

/* ---------- Notes ---------- */
const dlg=document.getElementById('noteDlg');let noteCtx='',noteDay=null;
function openNote(ctx,day=null){noteCtx=ctx;noteDay=day;document.getElementById('noteCtx').textContent=ctx;document.getElementById('noteText').value='';dlg.showModal();document.getElementById('noteText').focus()}
document.getElementById('noteSlideBtn').onclick=()=>{const v=SLIDES[cur].view,dk=typeof v==='number'?v:({d0:0,d4:4}[SLIDES[cur].id]??null);openNote(SLIDES[cur].label+' slide',dk)};
document.getElementById('noteCancel').onclick=()=>dlg.close();
document.getElementById('noteSave').onclick=()=>{const tx=document.getElementById('noteText').value.trim();if(tx){notes.push({time:new Date().toLocaleString(),context:noteCtx,day:noteDay,tag:'',text:tx});store.set(LS.notes,notes);renderNotes();
  if(noteDay!==null&&document.querySelector(`.fb[data-fb="${noteDay}"]`))rerender()}dlg.close()};
document.getElementById('noteText').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))document.getElementById('noteSave').click()});
function renderNotes(){
  document.getElementById('noteCount').textContent=notes.length;
  document.getElementById('noteList').innerHTML=notes.length?notes.map((n,i)=>`<div class="note"><button class="del" data-del="${i}">Delete</button><div class="ctx">${esc(n.context)}${n.tag?' · '+esc(n.tag):''}</div>${esc(n.text)}<div class="small muted">${esc(n.time)}</div></div>`).join(''):'<p class="muted small">No notes yet. Use the feedback box on each day, press N, or click “Add note” on any slide, route, pin or clip.</p>';
}
document.getElementById('noteList').onclick=e=>{const d=e.target.closest('[data-del]');if(d){notes.splice(+d.dataset.del,1);store.set(LS.notes,notes);renderNotes();rerender()}};
document.getElementById('notesBtn').onclick=()=>document.getElementById('notes').classList.toggle('open');
document.getElementById('closeNotes').onclick=()=>document.getElementById('notes').classList.remove('open');
const csv=()=>'Time,Day,Where,Topic,Note\n'+notes.map(n=>[n.time,n.day!=null?DAYNAME[n.day]:'',n.context,n.tag||'',n.text].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
document.getElementById('exportNotes').onclick=()=>download('ktm-kerala-meeting-notes.csv','\ufeff'+csv(),'text/csv');
document.getElementById('copyNotes').onclick=()=>{navigator.clipboard?.writeText(notes.map(n=>`[${n.context}${n.tag?' · '+n.tag:''}] ${n.text}`).join('\n')).then(()=>{const b=document.getElementById('copyNotes');b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1500)})};

/* ---------- Lightbox ---------- */
let lbI=0;const lb=document.getElementById('lightbox'),lbImg=document.getElementById('lbImg');
function openLB(i){if(i<0)return;lbI=(i+PHOTOS.length)%PHOTOS.length;const id=PHOTOS[lbI][0];lbImg.dataset.f='';lbImg.src=img(id,2000);lbImg.style.display='';document.getElementById('lbFrame')?.remove();lbImg.onerror=()=>{if(!lbImg.dataset.f){lbImg.dataset.f=1;lbImg.src=img2(id,2000)}else{lbImg.style.display='none';const f=document.createElement('iframe');f.id='lbFrame';f.src=`https://drive.google.com/file/d/${id}/preview`;f.style.cssText='width:88vw;height:84vh;border:0;border-radius:8px;background:#000';lbImg.after(f)}};lbImg.alt=PHOTOS[lbI][1];document.getElementById('lbCap').textContent=`${PHOTOS[lbI][1]} · ${lbI+1} of ${PHOTOS.length}`;lb.classList.add('open')}
document.getElementById('lbClose').onclick=()=>lb.classList.remove('open');
document.getElementById('lbPrev').onclick=()=>openLB(lbI-1);document.getElementById('lbNext').onclick=()=>openLB(lbI+1);
lb.onclick=e=>{if(e.target===lb)lb.classList.remove('open')};

/* ---------- Keys ---------- */
document.getElementById('fsBtn').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};
document.addEventListener('keydown',e=>{
  const a=document.activeElement; if(dlg.open||/INPUT|TEXTAREA|SELECT/.test(a.tagName)||a.isContentEditable) return;
  if(document.body.classList.contains('at-home')){if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){e.preventDefault();enterDeck()}else if(e.key==='f'||e.key==='F'){document.getElementById('fsBtn').click()}return}
  if(document.getElementById('theatre').classList.contains('open')){if(e.key==='Escape')closeTheatre();return}
  if(lb.classList.contains('open')){if(e.key==='ArrowRight')openLB(lbI+1);else if(e.key==='ArrowLeft')openLB(lbI-1);else if(e.key==='Escape')lb.classList.remove('open');return}
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(cur+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();if(cur===0)showHome();else go(cur-1)}
  else if(e.key==='Escape'){closeDrawer();document.getElementById('notes').classList.remove('open')}
  else if(e.key==='n'||e.key==='N'){e.preventDefault();document.getElementById('noteSlideBtn').click()}
  else if(e.key==='e'||e.key==='E'){toggleEdit()}
  else if(e.key==='f'||e.key==='F'){document.getElementById('fsBtn').click()}
  else if(e.key==='h'||e.key==='H'){showHome()}
  else if(e.key==='+'||e.key==='='){userMoved=true;map.zoomIn(1)}
  else if(e.key==='-'||e.key==='_'){userMoved=true;map.zoomOut(1)}
  else if(e.key==='0'){fitCurrent()}
  else if(e.key==='m'||e.key==='M'){music.gesture=true;toggleMusic()}
  else if(e.key===' '&&currentDay){e.preventDefault();ride(currentDay,'full')}
});
window.addEventListener('hashchange',()=>{const i=SLIDES.findIndex(s=>s.id===location.hash.slice(1));if(i>=0&&i!==cur&&!document.body.classList.contains('at-home'))go(i)});
renderNotes();
</script>
</body>
</html>
